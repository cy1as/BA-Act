<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | My Little Archive</title>

    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="login-page">

    <main class="login-container">

        <div class="login-card register-card">

            <div class="login-symbol">
                ☾
            </div>

            <p class="small-heading">
                MY LITTLE ARCHIVE
            </p>

            <h1>
                Create your account.
            </h1>

            <p class="login-subtitle">
                Start your own little collection of moments.
            </p>


            <form action="login.html">

                <div class="input-group-custom">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Your full name"
                        required>

                </div>


                <div class="input-group-custom">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required>

                </div>


                <div class="input-group-custom">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required>

                </div>


                <div class="input-group-custom">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required>

                </div>


                <div class="input-group-custom">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        required>

                </div>


                <label class="terms-check">

                    <input type="checkbox" required>

                    I agree to the Terms and Conditions.

                </label>


                <button type="submit" class="login-button">
                    Create Account
                </button>

            </form>


            <p class="account-text register-bottom">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </main>

</body>

</html>
